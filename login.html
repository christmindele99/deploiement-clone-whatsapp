<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kadea Chat/Connexion</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <header>
        <nav class="flex flex-col items-center justify-center mt-10 md:mt-15 mb-6 gap-2">
            <div class="logoContainer w-15 h-15 bg-blue-700 rounded-lg mb-2 md:w-18 md:h-18 flex items-center justify-center" aria-label="logo-kadea-chat">
                <svg class="text-white" xmlns="http://www.w3.org/2000/svg" width="2em" height="2em" viewBox="0 0 24 24">
	                <path d="M0 0h24v24H0z" fill="none" />
	                <path fill="currentColor" d="M2 22V4q0-.825.588-1.412T4 2h16q.825 0 1.413.588T22 4v12q0 .825-.587 1.413T20 18H6zm4-8h8v-2H6zm0-3h12V9H6zm0-3h12V6H6z" />
                </svg>
            </div>
            <h1 class="textLogoContainer text-blue-700 font-black text-xl md:text-2xl">Bienvenue à nouveau !</h1>
            <p class="text-sm md:text-lg md:w-90 text-gray-500 text-center w-70">Veuillez saisir vos informations pour vous connecter à <span class="text-blue-500 font-semibold">Kadea Chat</span></p>
        </nav>
    </header>
    <main class="flex flex-col justify-center items-center ">
        <div id="overlayLoader" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
            <div class="w-12 h-12 border-4 border-white/30 border-t-white rounded-full animate-spin"></div>
        </div>
        <section class="rounded-lg border-2 border-gray-200 w-85 h-85 p-4 md:p-5 md:w-120">
            <form id="connexionUser" class="flex flex-col gap-3">
                <label for="ChampTextSaisie">Adresse e-mail</label>
                <div class="bg-blue-50 rounded-lg w-75 md:w-110 p-2 h-10 flex items-center gap-2 focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-blue-500">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                        <path d="M0 0h24v24H0z" fill="none" />
                        <path fill="currentColor" d="M5 5h13a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3m0 1c-.5 0-.94.17-1.28.47l7.78 5.03l7.78-5.03C18.94 6.17 18.5 6 18 6zm6.5 6.71L3.13 7.28C3.05 7.5 3 7.75 3 8v9a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2V8c0-.25-.05-.5-.13-.72z" />
                    </svg>
                    <input type="email" id="champEmailConnexion" placeholder="jeanfrançois@gmail.com" class="outline-none w-full">
                </div>
                <p id="errorEmailConnexion" class="text-red-500 text-sm"></p>
                <section class="flex flex-col gap-1 mb-4">
                <div class="flex items-center justify-between">
                    <label for="ChampTextSaisie">Mot de passe</label>
                    <a href="#" class="text-blue-500">Mot de passe oublié ?</a>
                </div>
                <div class="bg-blue-50 rounded-lg w-75 mb-2 md:w-110 p-2 h-10 flex items-center gap-2 focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-blue-500">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                        <path d="M0 0h24v24H0z" fill="none" />
                        <path fill="currentColor" d="M12 17a2 2 0 0 1-2-2c0-1.11.89-2 2-2a2 2 0 0 1 2 2a2 2 0 0 1-2 2m6 3V10H6v10zm0-12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V10c0-1.11.89-2 2-2h1V6a5 5 0 0 1 5-5a5 5 0 0 1 5 5v2zm-6-5a3 3 0 0 0-3 3v2h6V6a3 3 0 0 0-3-3" />
                    </svg>
                    <input type="password" id="PasswordConnexion" placeholder="mang123@#" class="outline-none w-full">
                </div>
                <p id="errorPasswordConnexion" class="text-red-500 text-sm"></p>
                <label>
                    <input type="checkbox" />
                    Rester connecté
                </label>
            </section>
                <button type="submit" id="buttonConnexion" class="text-white bg-blue-500 w-75 md:w-110 h-10 rounded-lg mb-4 cursor-pointer flex items-center justify-center">Se connceter</button>
            </form>
        </section>
    </main>
    <footer class="mt-5 mb-10">
        <p class="text-center text-sm">Vous n’avez pas de compte ? <a href="index.html" class="text-blue-500">Créer un compte</a>
    </footer>
    <script src="login.js"></script>
</body>
</html>
